<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<div class="go-frost"></div>

<div class="go-screen">

  <!-- Decorative butterflies floating in the background -->
  <img src="/assets/images/butterfly.png" class="go-bf go-bf-1" alt="">
  <img src="/assets/images/butterfly.png" class="go-bf go-bf-2" alt="">
  <img src="/assets/images/butterfly.png" class="go-bf go-bf-3" alt="">
  <img src="/assets/images/butterfly.png" class="go-bf go-bf-4" alt="">

  <div class="result-card">

    <img src="/assets/images/butterfly.png" class="butterfly-card" alt="">

    <h1 class="go-title" id="go-heading">Round Complete!</h1>
    <p class="go-subtitle">The garden rests, but every season brings new growth.</p>

    <div class="stats">
      <div class="stat-row">
        <span>Final Score</span>
        <span id="go-score" class="stat-highlight">0</span>
      </div>
      <div class="stat-row">
        <span>Level Reached</span>
        <span id="go-level">1</span>
      </div>
      <div class="stat-row">
        <span>Accuracy</span>
        <span id="go-accuracy">0%</span>
      </div>
      <div class="stat-row">
        <span>Correct Sorts</span>
        <span id="go-correct" class="stat-green">0</span>
      </div>
      <div class="stat-row">
        <span>Incorrect Sorts</span>
        <span id="go-incorrect" class="stat-red">0</span>
      </div>
    </div>

    <div class="blossoms">
      <span id="go-blossoms">🌸🌸🌸</span>
      <p id="go-blossoms-label">3 Blossoms Preserved</p>
    </div>

    <div class="tip-box">
      <h3>🌱 Gardener's Tip</h3>
      <p id="go-tip"></p>
    </div>

    <div class="go-actions">
      <button id="btn-retry" class="play-btn">🌱 Restore the Garden</button>
      <button id="btn-leaderboard" class="go-btn-secondary">🏆 Leaderboard</button>
      <button id="btn-home" class="home-btn">🏠 Return to Gate</button>
    </div>

  </div>
</div>
